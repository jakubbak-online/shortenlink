services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shortenlink
      POSTGRES_USER: shortenlink
      POSTGRES_PASSWORD: shortenlink
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortenlink"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes: [.:/app]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
