services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shortenlink
      POSTGRES_USER: shortenlink
      POSTGRES_PASSWORD: shortenlink
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortenlink"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      RUN_MIGRATIONS: "1"
    env_file: .env
    volumes: [.:/app]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    # Bez limitu Celery domyślnie odpala tyle procesów, ile rdzeni ma
    # host (na deweloperskiej maszynie: 12) - do skali tego projektu to
    # przesada, a przy benchmarku lokalnym (Locust też na hoście, nie w
    # kontenerze) taki worker zaczyna konkurować o CPU z resztą stacku i
    # zniekształca pomiar.
    command: celery -A config worker --loglevel=info --concurrency=4
    env_file: .env
    volumes: [.:/app]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  beat:
    build: .
    # Harmonogram (kiedy odpalić dane zadanie) jest osobnym procesem od
    # workera (który je wykonuje) - dzięki temu można skalować workerów
    # do wielu instancji bez ryzyka, że to samo zadanie cykliczne odpali
    # się kilka razy naraz. DatabaseScheduler (ustawiony w settings.py)
    # czyta harmonogram z tabeli PeriodicTask, nie z tego pliku.
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    volumes: [.:/app]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
