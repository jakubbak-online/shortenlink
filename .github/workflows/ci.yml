name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shortenlink
          POSTGRES_USER: shortenlink
          POSTGRES_PASSWORD: shortenlink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shortenlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Wartości tylko na potrzeby CI - baza i cache i tak żyją wyłącznie
      # na czas tego joba, więc SECRET_KEY/IP_SALT nie muszą (i nie mogą)
      # być prawdziwymi sekretami z produkcji.
      SECRET_KEY: ci-tylko-do-testow-nieuzywany-nigdzie-indziej
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: shortenlink
      DB_USER: shortenlink
      DB_PASSWORD: shortenlink
      DB_HOST: localhost
      DB_PORT: "5432"
      IP_SALT: ci-tylko-do-testow-nieuzywana-nigdzie-indziej
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Zainstaluj zależności
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest
