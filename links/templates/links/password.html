{% extends "base.html" %}

{% block title %}skroclinka.pl: link chroniony hasłem{% endblock %}

{% block content %}
    <section class="hero">
        <h1>Ten link jest chroniony hasłem</h1>
        <p class="lead">Podaj hasło, żeby przejść dalej.</p>
    </section>

    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

    <form method="post" class="link-form">
        {% csrf_token %}
        <label for="id_password">Hasło</label>
        <input type="password" name="password" id="id_password" autofocus>
        <button type="submit">Przejdź dalej</button>
    </form>
{% endblock %}
