{% load static %}<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}skroclinka.pl{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script>
        // Ciemny jest domyślny (brak klasy = ciemny), więc jedyny przypadek
        // wymagający działania przed pierwszym malowaniem strony to
        // zapamiętane "light" - inaczej byłby moment ciemnego tła, zanim
        // JS na dole strony zdążyłby przełączyć na jasny (flash zmiany
        // motywu). Stąd ten skrypt jest tu, w <head>, synchronicznie, a
        // nie w extra_js na dole.
        if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.add("light");
        }
    </script>
</head>
<body>
    <header class="site-header">
        <a href="{% url 'links:create' %}" class="logo">skroclinka.pl</a>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
            <span class="theme-toggle-thumb"></span>
        </button>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>skroclinka.pl: skracacz linków z analityką</p>
        <p><a href="https://github.com/jakubbak-online/shortenlink">kod źródłowy na GitHubie</a></p>
        <p>Autorstwa Jakub Bąk</p>
    </footer>

    <script>
        (function () {
            var root = document.documentElement;
            var toggle = document.getElementById("theme-toggle");

            function isLight() {
                return root.classList.contains("light");
            }

            function updateToggle() {
                var light = isLight();
                toggle.setAttribute("aria-pressed", String(light));
                toggle.setAttribute("aria-label", light ? "Przełącz na ciemny motyw" : "Przełącz na jasny motyw");
            }

            updateToggle();
            toggle.addEventListener("click", function () {
                root.classList.toggle("light");
                localStorage.setItem("theme", isLight() ? "light" : "dark");
                updateToggle();
            });
        })();
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
